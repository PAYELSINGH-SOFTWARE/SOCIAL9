name: flutter_application_1
description: "Social9 mobile: the Social9 website with secure native device integrations."
publish_to: 'none'

version: 1.1.1+3

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.5.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  file_picker: ^10.3.10
  app_links: ^7.0.0
  flutter_secure_storage: ^10.3.1
  fl_chart: ^1.2.0
  intl: ^0.20.3
  razorpay_flutter: ^1.4.0
  webview_flutter: 4.13.1
  webview_flutter_android: 4.11.0
  webview_flutter_wkwebview: 3.24.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  webview_flutter_platform_interface: 2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/mobile_bridge.js
    - assets/images/social9-web-mark.png
    - assets/content_templates.json
    - assets/images/social9_logo.png
    - assets/images/vcuesocial9_logo_v2.png
    - assets/images/vcue9_wordmark_v3.png
